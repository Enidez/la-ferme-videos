<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#05070b}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../../node_modules/three/build/three.module.js","three/addons/":"../../node_modules/three/examples/jsm/"}}</script>
</head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../assets/geo/departements.js"></script>
<script type="module">
// ============ J+1 — prototype « salle de crise » : carte de France en 3D (départements extrudés), caméra drone, alerte qui se propage
// renderFrame(f) déterministe, même contrat que le moteur du tableau (window.ready, DURATION, EVENTS) -> tools/render.py
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
const W=1080,H=1920,FPS=30,DUR=12;window.DURATION=DUR;window.EVENTS=[];
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});R.setSize(W,H,false);R.setPixelRatio(1);
R.toneMapping=THREE.ACESFilmicToneMapping;R.outputColorSpace=THREE.SRGBColorSpace;
const S=new THREE.Scene();S.background=new THREE.Color('#05070b');S.fog=new THREE.Fog('#05070b',18,46);
const CAM=new THREE.PerspectiveCamera(38,W/H,.1,200);
S.add(new THREE.HemisphereLight('#9fb8d8','#0a0c10',1.1));
const FX=new EffectComposer(R);FX.setSize(W,H);FX.addPass(new RenderPass(S,CAM));FX.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),.9,.6,.18));FX.addPass(new OutputPass());
const sun=new THREE.DirectionalLight('#ffe2bd',2.6);sun.position.set(-8,14,10);S.add(sun);
// sol tactique : grille + halo
const grid=new THREE.GridHelper(80,80,'#1d3247','#101b27');grid.position.y=-.02;S.add(grid);
// projection simple (équirectangulaire corrigée à 46,5° N), centre de la France
const L0=2.4,P0=46.6,K=Math.cos(P0*Math.PI/180),SC=1.05;
const pr=([lo,la])=>new THREE.Vector2((lo-L0)*K*SC,-(la-P0)*SC);
const DEP=[];
window.ready=(async()=>{
  const g=window.GEO_DEPARTEMENTS;
  for(const f of g.features){
    const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    const shapes=polys.map(p=>{const sh=new THREE.Shape(p[0].map(pr));p.slice(1).forEach(h=>sh.holes.push(new THREE.Path(h.map(pr))));return sh;});
    const geo=new THREE.ExtrudeGeometry(shapes,{depth:.18,bevelEnabled:false});geo.rotateX(Math.PI/2);geo.translate(0,.18,0);
    const mat=new THREE.MeshStandardMaterial({color:'#3d5570',roughness:.65,metalness:.15,emissive:'#000000'});
    const m=new THREE.Mesh(geo,mat);S.add(m);
    const ed=new THREE.LineSegments(new THREE.EdgesGeometry(geo,30),new THREE.LineBasicMaterial({color:'#6fa3c8',transparent:true,opacity:.5}));S.add(ed);
    geo.computeBoundingBox();const c=new THREE.Vector3();geo.boundingBox.getCenter(c);
    DEP.push({code:f.properties.code,nom:f.properties.nom,m,mat,ed,c});
  }
  const paris=DEP.find(d=>d.code==='75').c;DEP.forEach(d=>d.dist=d.c.distanceTo(paris));
})();
const lin=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a))),eo=x=>1-Math.pow(1-x,3);
const RED=new THREE.Color('#ff3a2e'),AMB=new THREE.Color('#ffb21e'),BASE=new THREE.Color('#3d5570'),BLUE=new THREE.Color('#6fa3c8');
window.renderFrame=f=>{
  const t=f/FPS;
  // caméra drone : arrive du dessus, plonge en oblique, orbite lente
  const a=-.35+.3*eo(lin(t,0,DUR)),tilt=1.35-.6*eo(lin(t,0,5)),dist=40-9*eo(lin(t,0,6));
  CAM.position.set(Math.sin(a)*dist*Math.cos(tilt)+.4,dist*Math.sin(tilt),Math.cos(a)*dist*Math.cos(tilt));CAM.lookAt(0,0,.6);
  // alerte : l'onde part de Paris à 3 s et avance de 1,6 unité par seconde
  const front=(t-3)*1.6;
  DEP.forEach(d=>{const k=front>0?Math.max(0,Math.min(1,(front-d.dist)/1.2)):0;const pulse=k>0?.6+.4*Math.sin(t*6-d.dist):0;
    d.mat.color.copy(BASE).lerp(RED,k*.35);d.mat.emissive.copy(RED).multiplyScalar(k*.35*pulse);
    d.m.position.y=k*.12*Math.sin(Math.min(1,k)*Math.PI/2);d.ed.position.y=d.m.position.y;d.ed.material.color.copy(k>0?RED:BLUE);d.ed.material.opacity=.5+.5*k;});
  FX.render();
};
</script>
</body></html>
