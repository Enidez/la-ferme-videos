// marche : balancement jambes/bras, petit rebond

  else{const k=eio(lin(t,2.4,2.9));walk(mamie,t*7*(1-k),{armL:[-.9,-.1,-.6]});mamie.position.set(mix(xa,-4.22,k),y3,mix(1.15,.9,k));mamie.rotation.y=Math.PI/2;

function sceneA(t){pov=false;HL.visible=HR.visible=false;LT.visible=true;lamp.position.set(-1.3,y3+1.3,.45);mamieA(t,KN_A);

function sceneB(t){pov=true;mamieA(Math.max(2.9,t),KN_B.map(x=>x-TB));pose(sam,{});sam.position.set(0,-50,0);

  const path=[[-.65,.45],[-.75,1.25],[-2.3,1.38],[-3.12,.9]];const wk=lin(t,3.7,7.0);let px,pz;
  {const seg=wk*3,i=Math.min(2,Math.floor(seg)),f=eio(seg-i);px=mix(path[i][0],path[i+1][0],i===0?eio(f):f);pz=mix(path[i][1],path[i+1][1],i===0?eio(f):f);if(wk>=1){px=path[3][0];pz=path[3][1];}}

  const tgt=look0.clone().lerp(lookDoor,kl);if(wk>0&&wk<1){const ahead=new THREE.Vector3(path[Math.min(3,Math.floor(wk*3)+1)][0],y3+1.35,path[Math.min(3,Math.floor(wk*3)+1)][1]);tgt.lerp(ahead,.5*Math.sin(wk*Math.PI));}
