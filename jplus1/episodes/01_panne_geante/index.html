import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

ev(N(30),'boom');ev(N(33)+.3,'tick');ev(N(34)-1.3,'riser');[0,.42,.84].forEach(d=>ev(NE(35)+.3+d,'thud'));ev(T.I+.1,'hit');ev(VEND+.3,'boom');

const SM=new THREE.Scene();SM.background=new THREE.Color('#04060a');SM.fog=new THREE.Fog('#04060a',20,48);

const OBJ={};const GL=new GLTFLoader();

  o.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true;}});const grp=new THREE.Group();grp.add(o);ST.add(grp);OBJ[id]={grp,x,z,h};return grp;};
const ease=(t,a)=>eo(lin(t,a,a+.45));

    const sh=polys.map(p=>{const s=new THREE.Shape(p[0].map(pr));p.slice(1).forEach(h=>s.holes.push(new THREE.Path(h.map(pr))));return s;});
    const geo=new THREE.ExtrudeGeometry(sh,{depth:.18,bevelEnabled:false});geo.rotateX(Math.PI/2);geo.translate(0,.18,0);geo.computeBoundingBox();const c=new THREE.Vector3();geo.boundingBox.getCenter(c);

  const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,14),new THREE.MeshStandardMaterial({map:dif,color:'#6d7480',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;ST.add(floor);

  await put('plastic_bottle_gallon',-6.6,0,1.1,.3);await put('plastic_jerrycan',-5.3,-.4,1.2,-.4);await put('metal_jerrycan_green',-4.0,.2,1.15,.5);

  await put('Lantern_01',8.6,0,1.0,0);await put('wall_clock',7.2,-2.5,1.0,0);OBJ.wall_clock.grp.children[0].position.y+=2.2;

let NOISE,FXM,FXT;
function BUILD(){FXM=new EffectComposer(R);FXM.setSize(W,H);FXM.addPass(new RenderPass(SM,CM));FXM.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),.7,.55,.3));FXM.addPass(new OutputPass());
  FXT=new EffectComposer(R);FXT.setSize(W,H);FXT.addPass(new RenderPass(ST,CT));FXT.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),.45,.5,.6));FXT.addPass(new OutputPass());}
// ---------------- état de la carte (lumières des villes qui s'éteignent)
const LIT=new THREE.Color('#ffb54a'),BASE=new THREE.Color('#2b3d52'),DARK=new THREE.Color('#121a24'),REDC=new THREE.Color(RED);
function mapState(t){
  const wave=(t-.25)*5.2;   // la panne part du sud-ouest (l'Espagne) et avale le pays en ~3 s
  DEP.forEach(d=>{let lit=1-lin(wave-d.ds,-.6,.6);
    if(t>=T.B&&t<T.D)lit=0;                       // tout est noir
    let col=BASE.clone().lerp(DARK,1-lit),em=LIT.clone().multiplyScalar(lit*(.55+.25*Math.sin(d.rnd*40+t*3)));
    const edge=lin(wave-d.ds,-.6,0)*(1-lin(wave-d.ds,0,1.2));em.add(REDC.clone().multiplyScalar(edge*.9));
    if(t>=T.C&&t<T.D&&d.dl<1.1){const p=.5+.5*Math.sin(t*5);em.add(REDC.clone().multiplyScalar(.25*p*lin(t,N(13)-.4,N(13))));}
    if(t>=T.G){col=DARK.clone();em=new THREE.Color(0,0,0);}

  else if(t<T.C){const k=eio(lin(t,T.B,T.C));pos=new THREE.Vector3(mix(-2.5,-3.4,k),mix(13,11,k),mix(12,10.5,k));look=new THREE.Vector3(-1.5,0,4.2);}
  else if(t<T.D){const k=eio(lin(t,T.C,T.D));pos=new THREE.Vector3(mix(3,LYON.x+.4,k),mix(13,5.2,k),mix(9,LYON.z+5.2,k));look=new THREE.Vector3(mix(1.5,LYON.x,k),0,mix(1.5,LYON.z,k));}
  else{const k=eio(lin(t,T.G,T.G2));pos=new THREE.Vector3(mix(.4,0,k),mix(30,26,k),mix(12,10,k));look=new THREE.Vector3(0,0,.6);}
  CM.position.copy(pos);CM.lookAt(look);sunM.intensity=t>=T.G?.15:1.6;
}
// ---------------- état de la table (objets qui apparaissent, la lumière du jour qui baisse)
const pop=(id,t0,t)=>{const o=OBJ[id];if(!o)return;const k=t0==null?1:eo(lin(t,t0,t0+.4));o.grp.visible=k>0;o.grp.scale.setScalar(Math.max(.001,k*(1+.08*Math.sin(Math.min(1,lin(t,t0,t0+.4))*Math.PI))));o.grp.position.y=(1-k)*.6;};
function tableState(t){
  pop('plastic_bottle_gallon',N(14)+.2,t);pop('plastic_jerrycan',N(14)+.7,t);pop('metal_jerrycan_green',N(14)+1.2,t);
  pop('vintage_radio_transceiver',T.E+.2,t);pop('long_life_food',T.F+.3,t);pop('russian_food_cans_01',N(28)+.2,t);pop('Lantern_01',T.G2+.1,t);pop('wall_clock',T.G2+.5,t);

  const fl=t>=T.G2?(.85+.15*Math.sin(t*17)*Math.sin(t*7.3)):0;lamp.intensity=t>=T.G2?mix(0,14,eo(lin(t,T.G2+.1,T.G2+.8)))*fl*(t>=T.Hk?mix(1,.55,lin(t,T.Hk,N(35))):1):0;

  if(t<T.E)shot(-5.3,.4,1.9,T.D);else if(t<T.F)shot(-.3,-.6,1.5,T.E);else if(t<T.G)shot(4.2,-.2,1.6,T.F);
  else{const k=lin(t,T.G2,T.I);CT.position.set(8.0+.5*k,1.55-.25*k,3.6-1.2*k);CT.lookAt(8.4,.7,-.4);}
}
// ---------------- 2D : textes, HUD, sous-titres
function txt(s,x,y,f,c,al='left',ls=0,a=1,glow=0){ctx.save();ctx.globalAlpha*=a;ctx.font=f;ctx.fillStyle=c;ctx.textAlign=al;ctx.textBaseline='alphabetic';if(ls)ctx.letterSpacing=ls+'px';if(glow){ctx.shadowColor=c;ctx.shadowBlur=glow;}ctx.fillText(s,x,y);ctx.restore();}

const CH=[];SEGS.forEach(s=>{const ws=s.txt.split(' ');const tot=ws.reduce((a,w)=>a+w.length+1,0);let acc=0;const dur=s.t1-s.t0;const wt=ws.map(w=>{const tt=s.t0+dur*acc/tot;acc+=w.length+1;return[w,tt];});
