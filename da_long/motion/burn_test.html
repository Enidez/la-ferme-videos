<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas><script>
// Labo DA format long — test de mouvement : projecteur (grain, scintillement, tremblement, poussières) + transitions « film burn »
const W=1920,H=1080,FPS=30;const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lin=(t,a,b)=>cl((t-a)/(b-a)),ease=x=>x*x*(3-2*x);
function rng(s){s>>>=0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
// plans : [image, début, fin, zoom départ, zoom fin, point de visée x,y]
const SHOTS=[['C2_1',0,3.6,1.0,1.05,.5,.45],['C2_2',3.6,7.4,1.04,1.0,.45,.45],['C2_3',7.4,11.2,1.0,1.06,.3,.5],['C2_5',11.2,15,1.06,1.0,.7,.4]];
const BURNS=[{t:3.6,kind:'burn'},{t:7.4,kind:'slip'},{t:11.2,kind:'burn'}];   // transitions (centrées sur la coupe)
const DUR=15;window.DURATION=DUR;window.EVENTS=[];BURNS.forEach(b=>window.EVENTS.push([b.t-.45,'projo']));
const IM={};function load(s){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s;});}
// grain précalculé
const GR=[];for(let k=0;k<8;k++){const g=document.createElement('canvas');g.width=640;g.height=360;const c=g.getContext('2d'),d=c.createImageData(640,360),r=rng(7+k);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}c.putImageData(d,0,0);GR.push(g);}
// nuage de brûlure (bruit basse fréquence) précalculé
const BN=(()=>{const g=document.createElement('canvas');g.width=480;g.height=270;const c=g.getContext('2d');const r=rng(42);
  for(let i=0;i<140;i++){const x=r()*480,y=r()*270,rad=20+r()*90;const gr=c.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,`rgba(255,255,255,${.25+r()*.4})`);gr.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=gr;c.fillRect(0,0,480,270);}const o=document.createElement('canvas');o.width=480;o.height=270;const oc=o.getContext('2d');oc.drawImage(g,0,0);oc.globalCompositeOperation='source-in';oc.fillStyle='rgb(255,110,20)';oc.fillRect(0,0,480,270);return o;})();
function shotAt(t){return SHOTS.find(s=>t>=s[1]&&t<s[2])||SHOTS[SHOTS.length-1];}
function drawShot(s,t,dx,dy){const im=IM[s[0]];if(!im)return;const u=ease(lin(t,s[1],s[2]));const z=s[3]+(s[4]-s[3])*u;
  ctx.save();ctx.translate(W/2+dx,H/2+dy);ctx.scale(z,z);ctx.translate(-W*s[5]-(W/2-W*s[5])*(1/z),-H*s[6]-(H/2-H*s[6])*(1/z));ctx.drawImage(im,0,0,W,H);ctx.restore();}
function burnAmt(t){let a=0,b0=null;for(const b of BURNS){const d=t-b.t;if(d>-.4&&d<.5){const v=d<0?Math.pow(lin(d,-.4,0),2):Math.pow(1-lin(d,0,.5),1.6);if(v>a){a=v;b0=b;}}}return[a,b0];}
window.ready=(async()=>{for(const k of ['C2_1','C2_2','C2_3','C2_5'])IM[k]=await load('../frames/'+k+'.jpg');})();
window.renderFrame=f=>{const t=f/FPS,r=rng(f*977+3);const [ba,bb]=burnAmt(t);
  // tremblement du couloir (gate weave) + petits sauts
  let dx=Math.sin(t*3.1)*1.6+Math.sin(t*7.7)*.9+(r()-.5)*1.2,dy=Math.sin(t*2.3)*1.4+(r()-.5)*1.2;
  if(bb&&bb.kind==='slip'&&ba>.15){dy+=(t<bb.t?1:-1)*Math.pow(ba,2)*H*.55;}   // la pellicule décroche
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  drawShot(shotAt(t),t,dx,dy);
  if(bb&&bb.kind==='slip'&&ba>.15){const sh=SHOTS[SHOTS.indexOf(shotAt(t))+(t<bb.t?1:-1)];if(sh){drawShot(sh,t,dx,dy+(t<bb.t?-1:1)*H);}
    // barre de séparation entre deux images, avec perforations
    const yb=H/2+dy+(t<bb.t?-1:1)*H/2*0;ctx.fillStyle='#050403';const by=(dy>0?dy-H/2:dy+H/2)+H/2-40;ctx.fillRect(0,by,W,80);
    ctx.fillStyle='#d8cdb2';for(let x=40;x<W;x+=150){ctx.fillRect(x,by+22,60,36);} }
  // scintillement de la lampe
  const fl=.06*Math.sin(t*48)+(r()-.5)*.08;ctx.fillStyle=fl>0?`rgba(255,244,225,${fl*.6})`:`rgba(0,0,0,${-fl})`;ctx.fillRect(0,0,W,H);
  // brûlure : voile chaud, coeur blanc brûlé, bords rongés
  if(ba>0){const cx=W*(.25+.5*(bb.t%1.7)/1.7),cy=H*(.3+.4*((bb.t*3.3)%1));
    ctx.save();ctx.globalCompositeOperation='screen';
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,W*(.18+.9*ba));g.addColorStop(0,`rgba(255,225,170,${ba})`);g.addColorStop(.25,`rgba(255,120,25,${ba*.95})`);g.addColorStop(.6,`rgba(190,35,5,${ba*.75})`);g.addColorStop(1,'rgba(60,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=ba*.9;ctx.drawImage(BN,(r()-.5)*40-100,(r()-.5)*40-60,W+200,H+120);ctx.restore();
    // bords qui noircissent (pellicule qui se consume)
    ctx.save();ctx.globalAlpha=ba*.55;const e=ctx.createRadialGradient(cx,cy,W*(.35+.6*ba),cx,cy,W*(.9+.6*ba));e.addColorStop(0,'rgba(0,0,0,0)');e.addColorStop(1,'rgba(20,4,0,1)');ctx.fillStyle=e;ctx.fillRect(0,0,W,H);ctx.restore();
    if(ba>.9){ctx.fillStyle=`rgba(255,240,210,${(ba-.9)/.1*.85})`;ctx.fillRect(0,0,W,H);} }
  // poussières, cheveux, rayures
  for(let i=0;i<5;i++)if(r()<.5){ctx.fillStyle=`rgba(${r()<.5?0:240},${r()<.5?0:235},${r()<.5?0:220},${.4+r()*.4})`;ctx.beginPath();ctx.arc(r()*W,r()*H,1+r()*3.5,0,6.28);ctx.fill();}
  if(r()<.08){ctx.strokeStyle='rgba(20,15,10,.55)';ctx.lineWidth=2;ctx.beginPath();const x=r()*W,y=r()*H;ctx.moveTo(x,y);ctx.bezierCurveTo(x+40,y+20,x-30,y+60,x+20,y+110);ctx.stroke();}
  if(r()<.35){ctx.strokeStyle=`rgba(235,230,215,${.08+r()*.12})`;ctx.lineWidth=1+r()*1.5;const x=(Math.floor(t*.7)*613%W)+(r()-.5)*6;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  // grain + vignettage + légère teinte chaude
  ctx.save();ctx.globalAlpha=.16;ctx.globalCompositeOperation='overlay';ctx.drawImage(GR[f%8],0,0,W,H);ctx.restore();
  const v=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*1.05);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='soft-light';ctx.fillStyle='rgba(255,200,140,.06)';ctx.fillRect(0,0,W,H);ctx.restore();
};
</script></body></html>
