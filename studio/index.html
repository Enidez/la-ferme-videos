<title>Studio La Ferme</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Mur de production : bandeau de compteurs, puis une colonne par étape (à traiter → publié), cartes filtrables par chaîne */
:root{
  --bg:#f3f1ec;--panel:#ffffff;--ink:#1a1c1b;--muted:#5d625f;--line:#d9d6cf;
  --amber:#b77400;--red:#c3332b;--cyan:#1f6f97;--green:#2f7d45;--chip:#ebe8e1;
  --display:"Anton","Impact","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--panel:#171a1e;--ink:#ecebe5;--muted:#9aa09c;--line:#2a2f35;--amber:#ffb21e;--red:#ff5a4e;--cyan:#7fc3e6;--green:#6bd38a;--chip:#22262c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1013;--panel:#171a1e;--ink:#ecebe5;--muted:#9aa09c;--line:#2a2f35;--amber:#ffb21e;--red:#ff5a4e;--cyan:#7fc3e6;--green:#6bd38a;--chip:#22262c;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,56px);line-height:1;margin:0;letter-spacing:.5px;text-wrap:balance}
h1 span{color:var(--red)}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.count{display:flex;align-items:baseline;gap:8px;background:var(--panel);border:1px solid var(--line);padding:8px 12px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.count b{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:0;font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.f{font:600 13px var(--body);padding:7px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.f[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.f:focus-visible,select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.board{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.5px;display:flex;justify-content:space-between;border-bottom:3px solid var(--line);padding-bottom:6px}
.col[data-s="a_traiter"] h2{border-color:var(--red)}.col[data-s="en_cours"] h2{border-color:var(--amber)}.col[data-s="a_valider"] h2{border-color:var(--cyan)}.col[data-s="pret"] h2{border-color:var(--green)}
.col h2 small{font-family:var(--mono);font-size:13px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;background:var(--chip);color:var(--muted)}
.pill.ch{color:var(--ink)}
.pill.t-video{color:var(--red)}.pill.t-script{color:var(--amber)}.pill.t-document{color:var(--cyan)}.pill.t-lien{color:var(--green)}.pill.t-piste{color:var(--muted)}
.card h3{margin:0;font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card p{margin:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:10px;font-family:var(--mono);font-size:12px}
.links a{color:var(--cyan);text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
select{font:12px var(--mono);background:var(--chip);color:var(--ink);border:1px solid var(--line);padding:3px 4px}
.empty{font-family:var(--mono);font-size:12px;color:var(--muted);padding:10px;border:1px dashed var(--line)}
form{background:var(--panel);border:1px solid var(--line);padding:14px;display:grid;grid-template-columns:2fr 1.2fr 1fr auto;gap:8px;align-items:end}
@media (max-width:760px){form{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);min-width:0}
input,form select{font:14px var(--body);padding:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);min-width:0}
.go{font:600 14px var(--body);padding:9px 16px;background:var(--red);color:#fff;border:0;cursor:pointer}
.status{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--muted)}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="tag">La Ferme · J+1 · Veille</div>
      <h1>STUDIO <span>LA FERME</span></h1>
    </div>
    <div class="counts" id="counts" aria-live="polite"></div>
  </header>

  <form id="add">
    <label for="u">Lien ou idée à traiter<input id="u" name="u" placeholder="https://… ou une idée de sujet" required></label>
    <label for="n">Note<input id="n" name="n" placeholder="Pourquoi ça t'intéresse"></label>
    <label for="c">Chaîne<select id="c" name="c"><option>La Ferme</option><option>J+1</option><option>Veille</option></select></label>
    <button class="go" id="addbtn" type="submit">Ajouter</button>
  </form>

  <div class="bar" role="group" aria-label="Filtrer">
    <button class="f" data-f="tout" aria-pressed="true">Tout</button>
    <button class="f" data-f="La Ferme" aria-pressed="false">La Ferme</button>
    <button class="f" data-f="J+1" aria-pressed="false">J+1</button>
    <button class="f" data-f="Veille" aria-pressed="false">Veille</button>
    <span class="status" id="st">Chargement du suivi…</span>
  </div>

  <div class="board" id="board"></div>
</div>

<script>
const S=[["a_traiter","À traiter"],["en_cours","En cours"],["a_valider","À valider"],["pret","Prêt"],["publie","Publié"]];
const T={lien:"Lien reçu",document:"Document",script:"Script",video:"Vidéo",piste:"Piste"};
const GH="https://github.com/Enidez/la-ferme-videos/blob/main/";
let ITEMS=[],FILTER="tout",DB=null,CANWRITE=null;
try{FILTER=localStorage.getItem("studio-filtre")||"tout";}catch(e){}
const $=s=>document.querySelector(s);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
function render(){
  document.querySelectorAll(".f").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.f===FILTER)));
  const list=ITEMS.filter(i=>FILTER==="tout"||i.chaine===FILTER);
  const cnt=$("#counts");cnt.replaceChildren();
  S.forEach(([k,l])=>{const c=el("div","count");const b=el("b",null,String(list.filter(i=>i.statut===k).length));c.append(b,document.createTextNode(l));cnt.append(c);});
  const board=$("#board");board.replaceChildren();
  S.forEach(([k,l])=>{const col=el("section","col");col.dataset.s=k;const its=list.filter(i=>i.statut===k).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const h=el("h2",null,l);h.append(el("small",null,String(its.length)));col.append(h);
    if(!its.length)col.append(el("div","empty",k==="a_traiter"?"Rien en attente. Ajoute un lien au-dessus.":"Vide pour l'instant."));
    its.forEach(i=>{const c=el("article","card");const m=el("div","meta");m.append(el("span","pill t-"+(i.type||"piste"),T[i.type]||i.type||"Piste"),el("span","pill ch",i.chaine||""));c.append(m);
      c.append(el("h3",null,i.titre||"(sans titre)"));if(i.note)c.append(el("p",null,i.note));
      const ln=el("div","links");if(i.url){const a=el("a",null,"Source");a.href=i.url;a.target="_blank";a.rel="noopener";ln.append(a);}
      (i.fichiers||[]).forEach(f=>{const a=el("a",null,f.split("/").pop());a.href=GH+f;a.target="_blank";a.rel="noopener";ln.append(a);});if(ln.children.length)c.append(ln);
      const ft=el("div","foot");ft.append(el("span",null,i.date||""));
      if(DB&&CANWRITE!==false){const sel=el("select");sel.id="s-"+i.id;sel.setAttribute("aria-label","Étape de "+(i.titre||""));S.forEach(([v,lab])=>{const o=el("option",null,lab);o.value=v;if(v===i.statut)o.selected=true;sel.append(o);});
        sel.addEventListener("change",async()=>{try{await DB.collection("items").doc(i.id).update({statut:sel.value,maj:new Date().toISOString()});}catch(e){CANWRITE=false;$("#st").textContent="Lecture seule : tu ne peux pas modifier ce suivi.";render();}});ft.append(sel);}
      else ft.append(el("span",null,(S.find(s=>s[0]===i.statut)||[,""])[1]));
      c.append(ft);col.append(c);});
    board.append(col);});
}
document.querySelectorAll(".f").forEach(b=>b.addEventListener("click",()=>{FILTER=b.dataset.f;try{localStorage.setItem("studio-filtre",FILTER);}catch(e){}render();}));
$("#add").addEventListener("submit",async e=>{e.preventDefault();if(!DB){$("#st").textContent="Le suivi n'est pas encore connecté. Réessaie dans un instant.";return;}
  const u=$("#u").value.trim(),n=$("#n").value.trim(),c=$("#c").value;if(!u)return;const isUrl=/^https?:\/\//.test(u);
  $("#addbtn").disabled=true;
  try{await DB.collection("items").add({type:isUrl?"lien":"piste",titre:isUrl?(n||u.replace(/^https?:\/\/(www\.)?/,"").slice(0,80)):u,note:isUrl?"":n,url:isUrl?u:"",chaine:c,statut:"a_traiter",date:new Date().toISOString().slice(0,10),maj:new Date().toISOString(),fichiers:[]});
    $("#u").value="";$("#n").value="";$("#st").textContent="Ajouté dans « À traiter ».";}
  catch(err){$("#st").textContent=err&&err.code==="invalid_argument"?"Tu n'as pas le droit d'ajouter ici.":"L'ajout n'a pas marché. Réessaie.";}
  $("#addbtn").disabled=false;});
render();
(async()=>{const db=await window.claude?.use?.("db");if(!db){$("#st").textContent="Suivi indisponible ici : ouvre la page connecté à claude.ai.";return;}
  DB=db;const user=await window.claude.use("user");if(user){try{CANWRITE=await user.can("data.write");}catch(e){}}
  db.collection("items").onSnapshot(s=>{ITEMS=s.docs.map(d=>Object.assign({id:d.id},d.data()));$("#st").textContent=ITEMS.length?ITEMS.length+" éléments suivis":"Aucun élément pour l'instant.";render();},
    e=>{$("#st").textContent="Connexion au suivi perdue. Recharge la page.";});
})();
</script>
