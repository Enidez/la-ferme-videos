<title>Studio Glissando</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : barre d'outils en haut, grille temps × notes au centre (seule zone qui défile), voix en dessous. Look unique, sombre, « salle de mixage ». */
:root{
  --bg:#0d0e14; --panel:#151722; --line:#252838; --ink:#e9e7f0; --dim:#8a8ca3; --accent:#c9a7ff; --hot:#ff7a59;
  --f-title:"Instrument Serif",Georgia,serif; --f-ui:Inter,system-ui,sans-serif; --f-num:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-ui);display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
h1{font:400 30px/1 var(--f-title);margin:0;letter-spacing:.2px}
h1 i{color:var(--accent)}
.grow{flex:1}
button,select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
button{cursor:pointer}button:hover{border-color:#3a3e55}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:#14101e;border-color:var(--accent);font-weight:600}
button[disabled]{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px}
label.f{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:13px}
label.f input{width:84px;padding:7px 6px 7px 10px;font-family:var(--f-num)}
#status{color:var(--dim);font-size:13px;min-height:18px}
.wrap{position:relative;flex:1;min-height:320px;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:auto;background:var(--panel);touch-action:pan-x pan-y}
canvas{display:block}
#voices{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.voice{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--panel);cursor:pointer}
.voice.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.dot{width:12px;height:12px;border-radius:50%}
.voice select{padding:3px 6px;font-size:12px}
.voice input[type=range]{width:70px}
.mono{font-family:var(--f-num)}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
#sel{display:flex;gap:8px;align-items:center}
@media (max-width:520px){h1{font-size:24px}label.f input{width:60px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <h1>Studio <i>Glissando</i></h1>
  <select id="proj" aria-label="Projet"></select>
  <button id="nouveau">Nouveau</button>
  <span class="grow"></span>
  <button id="play" class="primary">▶ Écouter</button>
  <button id="save">Enregistrer</button>
  <button id="export">Exporter l'audio</button>
</header>
<div class="row">
  <label class="f">Nom <input id="nom" style="width:160px;font-family:var(--f-ui)"></label>
  <label class="f">Durée (s) <input id="duree" type="number" min="5" max="600" step="1"></label>
  <label class="f">Glissé (s) <input id="glisse" type="number" min="0" max="3" step="0.05"></label>
  <label class="f">Grille (s) <input id="grille" type="number" min="0.05" max="4" step="0.05"></label>
  <label class="f">Réverb <input id="reverb" type="range" min="0" max="1" step="0.05" style="width:90px"></label>
  <label class="f">Zoom <input id="zoom" type="range" min="20" max="160" step="5" style="width:90px"></label>
  <span id="sel"></span>
</div>
<div id="status" role="status"></div>
<div class="wrap" id="wrap"><canvas id="cv"></canvas></div>
<div id="voices"></div>
<div class="hint">Touche la grille pour poser un point sur la voix active · fais glisser un point pour le déplacer · touche un point pour le choisir, puis « Supprimer » · touche la règle du haut pour placer la lecture.</div>

<script>
// ===== Studio Glissando — des voix qui tiennent des notes et glissent d'un point à l'autre =====
const NOTES=['do','do♯','ré','mi♭','mi','fa','fa♯','sol','la♭','la','si♭','si'];
const MIN=24,MAX=96,ROW=14,RULER=26,LABW=54;           // notes affichées (do1 → do7), hauteur d'une note en px
const $=id=>document.getElementById(id);
const nameOf=m=>NOTES[m%12]+(Math.floor(m/12)-1);
const HUES=[215,250,280,305,330,355,25,45,140,175,195,235];
let P=demo(), voice=0, sel=null, PX=60, playing=null, store=null, projList=[];
function demo(){ // exemple marqué comme tel : l'essai « bloom » (do mineur doux-amer)
  const ch=[[1.6,[48,51,55,58,60,62,63,67,70,74,75]],[5.8,[32,51,55,56,58,60,63,67,70,72,75]],[9.4,[29,51,53,55,56,63,65,67,68,75,77]],[13,[37,48,53,55,56,60,65,67,68,72,77]],[17.2,[39,50,53,55,58,62,65,67,70,74,77]],[20.8,[43,50,55,56,60,62,67,68,72,74,79]],[24.4,[36,50,51,55,60,62,63,67,72,74,79]]];
  const voix=[];for(let k=0;k<11;k++){const pts=[[0,k?60:36]].concat(ch.map(([t,n])=>[t,n[k]]));   // tout part d'un do, puis chaque accord
    voix.push({nom:k?'Voix '+k:'Basse',hue:HUES[k%HUES.length],timbre:k?'nappe':'basse',volume:k?0.55:0.8,muet:false,points:pts});}
  return{nom:'Exemple — bloom',duree:32,glisse:0.35,grille:0.2,reverb:0.45,voix,exemple:true};
}
// ---------- dessin
const cv=$('cv'),ctx=cv.getContext('2d'),wrap=$('wrap');
function size(){const W=LABW+P.duree*PX+40,H=RULER+(MAX-MIN+1)*ROW;const d=devicePixelRatio||1;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);draw();}
const xOf=t=>LABW+t*PX, yOf=m=>RULER+(MAX-m)*ROW+ROW/2, tOf=x=>(x-LABW)/PX, mOf=y=>Math.round(MAX-(y-RULER-ROW/2)/ROW);
function pitchAt(v,t){const p=[...v.points].sort((a,b)=>a[0]-b[0]);if(!p.length)return null;let prev=p[0][1];for(let i=0;i<p.length;i++){const[pt,pm]=p[i];if(t<pt)return prev;const g=Math.max(.001,P.glisse);if(t<pt+g&&i>0){const u=(t-pt)/g,e=u*u*(3-2*u);return prev+(pm-prev)*e;}prev=pm;}return prev;}
let playT=0;
function draw(){const W=cv.width/(devicePixelRatio||1),H=cv.height/(devicePixelRatio||1);
  ctx.fillStyle='#151722';ctx.fillRect(0,0,W,H);
  for(let m=MIN;m<=MAX;m++){const y=yOf(m)-ROW/2;const blk=[1,3,6,8,10].includes(m%12);ctx.fillStyle=blk?'#12131c':'#171a26';ctx.fillRect(LABW,y,W,ROW);if(m%12===0){ctx.fillStyle='#2b2f44';ctx.fillRect(LABW,y+ROW-1,W,1);}}
  for(let t=0;t<=P.duree;t+=P.grille){const x=xOf(t);const major=Math.abs(t-Math.round(t))<1e-6;ctx.fillStyle=major?'#2a2e43':'#1d2030';ctx.fillRect(x,RULER,1,H);}
  ctx.fillStyle='#10111a';ctx.fillRect(0,0,W,RULER);ctx.font='500 11px "JetBrains Mono",monospace';ctx.fillStyle='#8a8ca3';ctx.textAlign='center';
  for(let t=0;t<=P.duree;t++){ctx.fillText(t+'s',xOf(t),17);}
  ctx.fillStyle='#10111a';ctx.fillRect(0,RULER,LABW,H);ctx.textAlign='right';ctx.font='400 10px "JetBrains Mono",monospace';
  for(let m=MIN;m<=MAX;m++){if([0,4,7].includes(m%12)){ctx.fillStyle=m%12===0?'#c9c7d6':'#6f7190';ctx.fillText(nameOf(m),LABW-6,yOf(m)+3);}}
  P.voix.forEach((v,k)=>{if(!v.points.length)return;const a=k===voice?1:.55;ctx.strokeStyle=`hsla(${v.hue},85%,66%,${v.muet?.15:a})`;ctx.lineWidth=k===voice?2.6:1.8;ctx.beginPath();
    for(let t=0;t<=P.duree;t+=1/PX*2){const m=pitchAt(v,t);const x=xOf(t),y=yOf(m);t===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();
    v.points.forEach((p,i)=>{const on=sel&&sel.k===k&&sel.i===i;ctx.beginPath();ctx.arc(xOf(p[0]),yOf(p[1]),on?7:5,0,6.28);ctx.fillStyle=on?'#fff':`hsl(${v.hue},85%,${k===voice?70:55}%)`;ctx.fill();if(on){ctx.strokeStyle=`hsl(${v.hue},85%,66%)`;ctx.lineWidth=2;ctx.stroke();}});});
  const x=xOf(playT);ctx.fillStyle='#ff7a59';ctx.fillRect(x-1,0,2,H);}
// ---------- édition (souris et doigt)
let drag=null;
function hit(x,y){for(let k=P.voix.length-1;k>=0;k--){const v=P.voix[k];for(let i=0;i<v.points.length;i++){const p=v.points[i];if(Math.hypot(xOf(p[0])-x,yOf(p[1])-y)<11)return{k,i};}}return null;}
const snap=t=>Math.max(0,Math.min(P.duree,Math.round(t/P.grille)*P.grille));
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(y<RULER){playT=Math.max(0,tOf(x));draw();return;}
  const h=hit(x,y);if(h){sel=h;voice=h.k;drag={...h,moved:false};cv.setPointerCapture(e.pointerId);renderVoices();renderSel();draw();e.preventDefault();return;}
  if(x<LABW)return;const t=snap(tOf(x)),m=Math.max(MIN,Math.min(MAX,mOf(y)));const v=P.voix[voice];v.points.push([+t.toFixed(3),m]);v.points.sort((a,b)=>a[0]-b[0]);
  sel={k:voice,i:v.points.findIndex(p=>p[0]===+t.toFixed(3)&&p[1]===m)};dirty();renderSel();draw();preview(m,v);});
cv.addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;const v=P.voix[drag.k];const p=v.points[drag.i];
  const t=+snap(tOf(x)).toFixed(3),m=Math.max(MIN,Math.min(MAX,mOf(y)));if(p[0]===t&&p[1]===m)return;if(p[1]!==m)preview(m,v);p[0]=t;p[1]=m;drag.moved=true;draw();renderSel();});
cv.addEventListener('pointerup',()=>{if(drag){const v=P.voix[drag.k],p=v.points[drag.i];v.points.sort((a,b)=>a[0]-b[0]);sel={k:drag.k,i:v.points.indexOf(p)};if(drag.moved)dirty();drag=null;renderSel();draw();}});
function renderSel(){const s=$('sel');s.textContent='';if(!sel||!P.voix[sel.k]||!P.voix[sel.k].points[sel.i])return;const p=P.voix[sel.k].points[sel.i];
  const sp=document.createElement('span');sp.className='mono';sp.textContent=`${P.voix[sel.k].nom} · ${p[0].toFixed(2)} s · ${nameOf(p[1])}`;
  const b=document.createElement('button');b.textContent='Supprimer le point';b.onclick=()=>{P.voix[sel.k].points.splice(sel.i,1);sel=null;dirty();renderSel();draw();};s.append(sp,b);}
// ---------- voix
function renderVoices(){const box=$('voices');box.textContent='';P.voix.forEach((v,k)=>{const d=document.createElement('div');d.className='voice'+(k===voice?' on':'');
  const dot=document.createElement('span');dot.className='dot';dot.style.background=`hsl(${v.hue},85%,64%)`;
  const n=document.createElement('span');n.textContent=v.nom;
  const s=document.createElement('select');s.setAttribute('aria-label','Son de '+v.nom);[['nappe','Nappe'],['piano','Piano'],['basse','Basse'],['cloche','Cloche']].forEach(([val,l])=>{const o=document.createElement('option');o.value=val;o.textContent=l;if(v.timbre===val)o.selected=true;s.append(o);});s.onchange=()=>{v.timbre=s.value;dirty();};s.onclick=e=>e.stopPropagation();
  const vol=document.createElement('input');vol.type='range';vol.min=0;vol.max=1;vol.step=.05;vol.value=v.volume;vol.setAttribute('aria-label','Volume de '+v.nom);vol.oninput=()=>{v.volume=+vol.value;dirty();};vol.onclick=e=>e.stopPropagation();
  const mu=document.createElement('button');mu.textContent=v.muet?'Muette':'Son';mu.onclick=e=>{e.stopPropagation();v.muet=!v.muet;dirty();renderVoices();draw();};
  d.append(dot,n,s,vol,mu);d.onclick=()=>{voice=k;sel=null;renderVoices();renderSel();draw();};box.append(d);});
  const add=document.createElement('button');add.textContent='+ Voix';add.onclick=()=>{const k=P.voix.length;P.voix.push({nom:'Voix '+k,hue:HUES[k%HUES.length],timbre:'nappe',volume:.55,muet:false,points:[]});voice=k;dirty();renderVoices();draw();};box.append(add);}
// ---------- son (Web Audio)
let AC=null,REV=null,revCache=-1;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function irFor(a,secs=3){const n=a.sampleRate*secs,b=a.createBuffer(2,n,a.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/a.sampleRate/0.9);}return b;}
const hz=m=>440*Math.pow(2,(m-69)/12);
function buildGraph(a,out){const dry=a.createGain(),wet=a.createGain(),conv=a.createConvolver(),comp=a.createDynamicsCompressor();conv.buffer=irFor(a);dry.gain.value=1;wet.gain.value=P.reverb*.5;
  dry.connect(comp);dry.connect(conv);conv.connect(wet);wet.connect(comp);comp.threshold.value=-18;comp.ratio.value=3;const master=a.createGain();master.gain.value=.8;comp.connect(master);master.connect(out);return dry;}
function scheduleVoice(a,bus,v,t0,from){if(v.muet||!v.points.length)return[];const p=[...v.points].sort((x,y)=>x[0]-y[0]);const nodes=[];const g=a.createGain();g.gain.value=0;g.connect(bus);
  const vol=v.volume*(v.timbre==='basse'?.5:.22);const start=t0,end=t0+(P.duree-from);
  g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(vol,start+.4);g.gain.setValueAtTime(vol,Math.max(start+.4,end-1.5));g.gain.linearRampToValueAtTime(0,end);
  if(v.timbre==='nappe'||v.timbre==='basse'){const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=v.timbre==='basse'?700:1600;f.Q.value=.4;f.connect(g);
    const types=v.timbre==='basse'?[['sine',0],['triangle',0]]:[['sawtooth',-7],['sawtooth',7],['sawtooth',0],['sine',0]];
    types.forEach(([ty,det])=>{const o=a.createOscillator();o.type=ty;o.detune.value=det;const og=a.createGain();og.gain.value=ty==='sine'?.6:.33;o.connect(og);og.connect(f);
      o.frequency.setValueAtTime(hz(pitchAt(v,from)),start);p.forEach((pt,i)=>{if(pt[0]<from||i===0)return;const at=start+(pt[0]-from);o.frequency.setValueAtTime(hz(pitchAt(v,pt[0])),at);o.frequency.exponentialRampToValueAtTime(hz(pt[1]),at+Math.max(.01,P.glisse));});
      o.start(start);o.stop(end+.1);nodes.push(o);});}
  else{ // piano / cloche : une attaque à chaque point
    p.forEach(pt=>{if(pt[0]<from)return;const at=start+(pt[0]-from);const parts=v.timbre==='cloche'?[[1,1],[2.76,.5],[5.4,.25]]:[[1,1],[2,.45],[3,.22],[4,.12]];
      parts.forEach(([h,amp])=>{const o=a.createOscillator();o.frequency.value=hz(pt[1])*h;const og=a.createGain();og.gain.setValueAtTime(0,at);og.gain.linearRampToValueAtTime(amp*(v.timbre==='cloche'?2.2:3),at+.005);og.gain.exponentialRampToValueAtTime(.0001,at+(v.timbre==='cloche'?4:2.6)/h**.4);o.connect(og);og.connect(g);o.start(at);o.stop(at+4.2);nodes.push(o);});});}
  return nodes;}
function play(fromT,out,onEnd){const a=ac();if(a.state==='suspended')a.resume();const bus=buildGraph(a,out||a.destination);const t0=a.currentTime+.08;let nodes=[];P.voix.forEach(v=>nodes=nodes.concat(scheduleVoice(a,bus,v,t0,fromT)));
  const st={t0,from:fromT,nodes,stop(){nodes.forEach(n=>{try{n.stop();}catch(e){}});cancelAnimationFrame(st.raf);playing=null;$('play').textContent='▶ Écouter';},raf:0};
  const tick=()=>{playT=st.from+(a.currentTime-st.t0);if(playT>=P.duree){st.stop();playT=0;draw();onEnd&&onEnd();return;}draw();const x=xOf(playT);if(x>wrap.scrollLeft+wrap.clientWidth-80||x<wrap.scrollLeft)wrap.scrollLeft=x-120;st.raf=requestAnimationFrame(tick);};st.raf=requestAnimationFrame(tick);return st;}
function preview(m,v){if(playing)return;const a=ac();if(a.state==='suspended')a.resume();const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=hz(m);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.15,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.5);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.55);}
$('play').onclick=()=>{if(playing){playing.stop();return;}playing=play(playT>=P.duree-.1?0:playT);$('play').textContent='❚❚ Pause';};
// ---------- export (enregistrement en temps réel → .webm)
let downloads=null;
$('export').onclick=async()=>{if(playing)playing.stop();const a=ac();if(a.state==='suspended')await a.resume();const dest=a.createMediaStreamDestination();
  let rec;try{rec=new MediaRecorder(dest.stream,{mimeType:'audio/webm;codecs=opus',audioBitsPerSecond:192000});}catch(e){status('Ce navigateur ne sait pas enregistrer le son. Enregistre le projet : Claude fera le rendu.');return;}
  const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=async()=>{const blob=new Blob(chunks,{type:'audio/webm'});if(!downloads){status('Le téléchargement n’est pas possible ici. Enregistre le projet : Claude fera le rendu.');return;}
    try{await downloads.save({filename:(P.nom||'musique').replace(/[^\w\- àâéèêëîïôûùç]/gi,'')+'.webm',data:blob});status('Fichier audio prêt.');}catch(e){status(e&&e.code==='declined'?'Téléchargement annulé.':'Le téléchargement a échoué ('+(e&&e.code||'erreur')+').');}};
  rec.start();status('Enregistrement en cours ('+Math.round(P.duree)+' s)…');$('export').disabled=true;
  playing=play(0,dest,()=>{rec.stop();$('export').disabled=false;});$('play').textContent='❚❚ Pause';
};
// ---------- projets (enregistrés : Claude peut les relire et en préparer)
let saveTimer=null,isDirty=false;
function status(s){$('status').textContent=s;}
function dirty(){isDirty=true;status('Modifications non enregistrées');}
function fill(){$('nom').value=P.nom;$('duree').value=P.duree;$('glisse').value=P.glisse;$('grille').value=P.grille;$('reverb').value=P.reverb;$('zoom').value=PX;renderVoices();renderSel();size();}
['nom','duree','glisse','grille','reverb'].forEach(id=>$(id).addEventListener('change',()=>{const v=$(id).value;P[id]=id==='nom'?v:Math.max(+$(id).min||0,+v);dirty();size();}));
$('zoom').oninput=()=>{PX=+$('zoom').value;size();};
$('nouveau').onclick=()=>{if(playing)playing.stop();P={nom:'Nouvelle musique',duree:30,glisse:.35,grille:.25,reverb:.45,voix:[0,1,2,3].map(k=>({nom:k?'Voix '+k:'Basse',hue:HUES[k],timbre:k?'nappe':'basse',volume:k?.55:.8,muet:false,points:[]}))};P.id=null;voice=0;sel=null;fill();dirty();};
$('save').onclick=async()=>{if(!store){status('L’enregistrement n’est pas disponible ici (connecte-toi à claude.ai).');return;}
  const body=JSON.parse(JSON.stringify({nom:P.nom,duree:P.duree,glisse:P.glisse,grille:P.grille,reverb:P.reverb,voix:P.voix,maj:new Date().toISOString()}));
  try{if(P.id){await store.collection('projets').doc(P.id).set(body);}else{const r=await store.collection('projets').add(body);P.id=r.id;}isDirty=false;delete P.exemple;status('Enregistré. Claude peut relire « '+P.nom+' ».');}catch(e){status('Enregistrement refusé ('+(e&&e.code||'erreur')+').');}};
$('proj').onchange=()=>{const id=$('proj').value;if(id==='__demo'){P=demo();P.id=null;}else{const d=projList.find(x=>x.id===id);if(!d)return;P=JSON.parse(JSON.stringify(d.data()));P.id=id;}voice=0;sel=null;fill();status('');};
function renderProj(){const s=$('proj');s.textContent='';const o=document.createElement('option');o.value='__demo';o.textContent='Exemple — bloom';s.append(o);
  projList.forEach(d=>{const op=document.createElement('option');op.value=d.id;op.textContent=d.data().nom||d.id;s.append(op);});s.value=P.id||'__demo';}
fill();renderProj();status('Exemple chargé : l’essai « bloom ». Appuie sur Écouter.');
(async()=>{const c=window.claude;if(!c||!c.use)return;
  c.use('downloads').then(d=>{downloads=d;if(!d)$('export').hidden=true;});
  store=await c.use('db');if(!store){$('save').disabled=true;return;}
  const timer=setTimeout(()=>status('Les projets enregistrés ne répondent pas encore.'),10000);
  store.collection('projets').orderBy('maj','desc').onSnapshot(snap=>{if(!snap.metadata.fromCache)clearTimeout(timer);projList=snap.docs.filter(d=>d.exists);renderProj();
    if(P.id&&!isDirty){const d=projList.find(x=>x.id===P.id);if(d){P=JSON.parse(JSON.stringify(d.data()));P.id=d.id;fill();}}},e=>{clearTimeout(timer);status('Projets indisponibles ('+e.code+').');});})();
addEventListener('resize',()=>draw());
</script>
