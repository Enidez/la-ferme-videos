<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(node_modules/@fontsource/anton/files/anton-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-024F;}
@font-face{font-family:Anton;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2) format('woff2');}
@font-face{font-family:Mono;font-weight:700;src:url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2) format('woff2');}
html,body{margin:0}</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script>
// Couvertures « à la une » Instagram (DA tableau). Image n = frame n. Tout le contenu tient dans le cercle central (Ø 600).
const ctx=document.getElementById('c').getContext('2d');window.DURATION=3/30;window.EVENTS=[];
const INK='#ECEEE6',RED='#E8231F',AMB='#FFB21E';
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
function txt(s,x,y,f,c,ls=0,glow=0){ctx.save();ctx.font=f;ctx.fillStyle=c;ctx.textAlign='center';ctx.letterSpacing=ls+'px';if(glow){ctx.shadowColor=c==RED?'rgba(255,60,40,.8)':'rgba(255,255,255,.45)';ctx.shadowBlur=glow;}ctx.fillText(s,x,y);ctx.restore();}
function bg(){ctx.fillStyle='#3a3f3b';ctx.fillRect(0,0,1080,1920);const im=ctx.getImageData(0,0,1080,1920);const r=rng(5);for(let i=0;i<im.data.length;i+=4){const n=(r()-.5)*28;im.data[i]+=n;im.data[i+1]+=n;im.data[i+2]+=n;}ctx.putImageData(im,0,0);
  const v=ctx.createRadialGradient(540,960,250,540,960,1100);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(10,14,10,.75)');ctx.fillStyle=v;ctx.fillRect(0,0,1080,1920);}
function card(rot){ctx.save();ctx.translate(540,960);ctx.rotate(rot);ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=40;ctx.shadowOffsetY=18;ctx.fillStyle='rgba(14,15,14,.95)';ctx.fillRect(-300,-300,600,600);ctx.shadowColor='transparent';
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=4;ctx.strokeRect(-300,-300,600,600);const g=ctx.createRadialGradient(-4,-286,2,0,-282,16);g.addColorStop(0,'#ff6a5f');g.addColorStop(1,'#8e1512');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-282,16,0,6.283);ctx.fill();}
function stamp(s,y,size,col,rot){ctx.save();ctx.translate(0,y);ctx.rotate(rot);ctx.font=size+'px Anton';ctx.letterSpacing='4px';const w=ctx.measureText(s).width+50;ctx.strokeStyle=col;ctx.lineWidth=8;ctx.strokeRect(-w/2,-size*.78,w,size*1.12);ctx.fillStyle=col;ctx.textAlign='center';ctx.fillText(s,0,size*.2);ctx.restore();}
window.ready=(async()=>{await document.fonts.load('80px Anton');await document.fonts.load('700 30px Mono');})();
window.renderFrame=f=>{ctx.setTransform(1,0,0,1,0,0);bg();
  if(f===0){card(-.03);txt('LE',0,-60,'110px Anton',INK,4);txt('DOSSIER',0,90,'150px Anton',RED,4,16);txt('CHAQUE SOIR',0,190,'700 34px Mono','rgba(236,238,230,.75)',6);}
  if(f===1){card(.03);txt('SUR PIÈCES',0,-110,'700 40px Mono','rgba(236,238,230,.75)',6);stamp('VÉRIFIÉ',60,130,'#A9C79A',-.1);txt('SOURCES À L’ÉCRAN',0,200,'700 30px Mono',AMB,3);}
  if(f===2){card(-.02);txt('L A',0,-110,'60px Anton',RED,14);txt('FERME',0,80,'190px Anton',INK,4,14);ctx.fillStyle=RED;ctx.fillRect(-200,120,400,16);txt('QUI SOMMES-NOUS ?',0,210,'700 30px Mono','rgba(236,238,230,.75)',3);}
  ctx.restore();
};
</script></body></html>
