<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="segs.js"></script>
<script>
// ============ LA FERME — moteur « tableau d'enquêteur » en 16:9 (YouTube, format long) ============
const W=1920,H=1080,FPS=30,VEND=SEGS[SEGS.length-1].t1+.35,DUR=VEND+4.2;window.DURATION=DUR;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const INK='#ECEEE6',DIM='#6E776C',RED='#E8231F',AMB='#FFB21E',GREEN='#A9C79A',INKD='#1b1c1a',PINK='#c9302c',PAPERC='rgba(222,219,206,.95)',DK='rgba(10,10,10,.88)';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const lin=(t,a,b)=>cl((t-a)/(b-a));const eo=x=>1-Math.pow(1-x,3);
const eback=x=>{const c=1.9;x=cl(x);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
const vis=(t,a,b,fi=.2,fo=.1)=>Math.min(lin(t,a,a+fi),1-lin(t,b-fo,b));
const EV=[];const ev=(t,k)=>{EV.push([+t.toFixed(3),k]);return t;};window.EVENTS=EV;
function txt(s,x,y,font,color,align='center',ls=0,alpha=1,glow=0){ctx.save();ctx.globalAlpha*=alpha;ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.letterSpacing=ls+'px';
  if(glow){ctx.shadowColor=color==RED||color==PINK?'rgba(255,60,40,.8)':'rgba(255,255,255,.55)';ctx.shadowBlur=glow;}ctx.fillText(s,x,y);ctx.restore();}
function mw(s,font,ls=0){ctx.save();ctx.font=font;ctx.letterSpacing=ls+'px';const w=ctx.measureText(s).width;ctx.restore();return w;}
function fitTxt(s,x,y,size,maxw,color,font='Anton',ls=2,alpha=1,glow=0,align='center'){let z=size;const F=z=>(font=='Anton'?'':'700 ')+z+'px '+font;while(z>14&&mw(s,F(z),ls)>maxw)z-=2;txt(s,x,y,F(z),color,align,ls,alpha,glow);return z;}
// texte sur plusieurs lignes, coupé à la largeur
function wrap(s,x,y,size,maxw,color,font='Anton',lh=1.18,align='center',alpha=1){const F=(font=='Anton'?'':'700 ')+size+'px '+font;const ws=s.split(' ');const L=[];let cur='';
  ws.forEach(w=>{const tr=cur?cur+' '+w:w;if(mw(tr,F)>maxw&&cur){L.push(cur);cur=w;}else cur=tr;});if(cur)L.push(cur);L.forEach((l,i)=>txt(l,x,y+i*size*lh,F,color,align,1,alpha));return L.length;}

// ---------- révélations : flash + punch
const REV=[];const reveal=(t,k=1)=>{REV.push([t,k]);ev(t,k>=1.2?'boom':'zap');return t;};
function punch(t){let s=0;for(const[a,k]of REV){const d=t-a;if(d>=0&&d<.6)s=Math.max(s,k*Math.pow(1-d/.6,3));}return s;}
function flash(t){for(const[a,k]of REV){const d=t-a;if(d<0||d>.3)continue;ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(225,235,255,${Math.pow(1-d/.3,2)*.55*Math.min(1,k)})`;ctx.fillRect(0,0,W,H);ctx.restore();}}

// ---------- images et extraits vidéo (chargés à la demande, fenêtre glissante)
const IM={};
function load(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});}
const FC=new Map();     // cache 'k/idx' -> Image
const fkey=(k,i)=>k+'/'+i;
async function ensureClips(t){const need=new Set();
  (window.CLIPUSE||[]).forEach(u=>{if(t<u.a-.4||t>u.b+.2)return;const n=window.CLIPN[u.k];const i0=cl(Math.floor((t-u.sync)*30),0,n-1);for(let i=i0;i<=Math.min(n-1,i0+40);i++)need.add(fkey(u.k,i));});
  for(const key of [...FC.keys()])if(!need.has(key))FC.delete(key);
  const ps=[];need.forEach(key=>{if(!FC.has(key)){const [k,i]=key.split('/');ps.push(load('frames/'+k+'/'+String(+i+1).padStart(4,'0')+'.jpg').then(im=>FC.set(key,im)));}});await Promise.all(ps);}
function VF(k,t,sync){const n=window.CLIPN[k];if(!n)return null;const i=cl(Math.floor((t-sync)*30),0,n-1);return FC.get(fkey(k,i))||null;}

// ---------- grain / poussière
const grains=[];for(let k=0;k<6;k++){const g=document.createElement('canvas');g.width=960;g.height=540;const gc=g.getContext('2d');const im=gc.createImageData(960,540);const r=rng(100+k);
  for(let i=0;i<im.data.length;i+=4){const v=r()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}gc.putImageData(im,0,0);grains.push(g);}
const DUST=[];{const r=rng(9);for(let i=0;i<150;i++)DUST.push({x:r()*W,y:r()*H,s:.6+r()*2.4,vx:(r()-.5)*14,vy:-4-r()*16,ph:r()*9,tw:.4+r()*2});}
function post(t){const fr=Math.floor(t*FPS);
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.fillStyle='rgba(220,228,215,1)';ctx.fillRect(0,0,W,H);ctx.restore();
  const g=ctx.createRadialGradient(960,520,520,960,540,1250);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(10,14,10,.62)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.10;ctx.globalCompositeOperation='overlay';ctx.drawImage(grains[fr%grains.length],0,0,W,H);ctx.restore();
  ctx.save();DUST.forEach(d=>{const x=(d.x+d.vx*t+W*3)%W,y=(d.y+d.vy*t+H*3)%H;ctx.fillStyle=`rgba(240,240,230,${.12+.22*Math.max(0,Math.sin(t*d.tw+d.ph))})`;ctx.beginPath();ctx.arc(x,y,d.s,0,6.283);ctx.fill();});ctx.restore();
  const r=rng(fr*31+5);const fl=(r()-.5)*.04;ctx.fillStyle=fl>0?`rgba(255,250,240,${fl*.5})`:`rgba(0,0,0,${-fl})`;ctx.fillRect(0,0,W,H);}

// ---------- sous-titres façon Arte : blanc, sobre, sans encadré, deux lignes maximum (Inter ≈ Helvetica Neue)
const SUBF='500 40px Inter';
const CHUNKS=[];SEGS.forEach(s=>{const ws=s.txt.split(' ');const tot=ws.reduce((a,w)=>a+w.length+1,0);let acc=0;const dur=s.t1-s.t0;
  const wt=ws.map(w=>{const tt=s.t0+dur*acc/tot;acc+=w.length+1;return[w,tt];});
  for(let i=0;i<wt.length;){let n=0,len=0;while(i+n<wt.length&&(n<3||len+wt[i+n][0].length<74)){len+=wt[i+n][0].length+1;n++;if(/[.?!…]$/.test(wt[i+n-1][0])&&len>22)break;}
    CHUNKS.push({v:s.v,txt:wt.slice(i,i+n).map(x=>x[0]).join(' '),t:wt[i][1]});i+=n;}});
CHUNKS.forEach((c,i)=>{c.e=i<CHUNKS.length-1?Math.min(CHUNKS[i+1].t,c.t+4.5):c.t+2.5;});
function subLines(s){ctx.font=SUBF;const ws=s.split(' ');if(ctx.measureText(s).width<=1250)return[s];let best=[s],bd=1e9;
  for(let k=1;k<ws.length;k++){const a=ws.slice(0,k).join(' '),b=ws.slice(k).join(' ');const d=Math.abs(ctx.measureText(a).width-ctx.measureText(b).width);if(d<bd){bd=d;best=[a,b];}}return best;}
function subs(t){const c=CHUNKS.find(c=>t>=c.t-.03&&t<c.e);if(!c)return;const a=lin(t,c.t-.03,c.t+.06)*(1-lin(t,c.e-.06,c.e));
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=a;ctx.font=SUBF;ctx.textAlign='center';ctx.letterSpacing='0px';
  const L=subLines(c.txt);const y0=1022-(L.length-1)*50;
  L.forEach((l,i)=>{ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(l,960,y0+i*50);ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=10;ctx.shadowOffsetY=2;ctx.fillStyle='#fff';ctx.fillText(l,960,y0+i*50);ctx.shadowColor='transparent';});
  ctx.restore();}
// synthé (nom + fonction) en bas à gauche, à la première apparition d'une vraie voix
const WHO={'AARON SWARTZ · 2012':['Aaron Swartz','Discours « How We Stopped SOPA », 2012 · traduit de l’anglais'],'FLORE VASSEUR':['Flore Vasseur','Écrivaine, autrice de « Ce qu’il reste de nos rêves »'],
  'PETER ECKERSLEY · AMI':['Peter Eckersley','Ami d’Aaron · traduit de l’anglais'],'LAWRENCE LESSIG':['Lawrence Lessig','Professeur de droit, son mentor · traduit de l’anglais']};
const SUPERS=[];{const last={};SEGS.forEach(s=>{if(!s.v||!WHO[s.who])return;if(last[s.who]!=null&&s.t0-last[s.who]<45){last[s.who]=s.t1;return;}SUPERS.push({t0:s.t0+.3,t1:Math.min(s.t1,s.t0+5),n:WHO[s.who][0],f:WHO[s.who][1]});last[s.who]=s.t1;});}
function supers(t){SUPERS.forEach(s=>{const a=vis(t,s.t0,s.t1,.35,.35);if(a<=0)return;const p=eo(lin(t,s.t0,s.t0+.5));ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=a;
  const g=ctx.createLinearGradient(0,0,760,0);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,742,760,120);
  ctx.fillStyle='#fff';ctx.fillRect(96,770,3,64);ctx.translate((1-p)*-20,0);ctx.letterSpacing='0px';
  ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=8;ctx.font='700 38px Inter';ctx.textAlign='left';ctx.fillText(s.n,120,800);ctx.font='400 25px Inter';ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillText(s.f,120,836);ctx.restore();});}
